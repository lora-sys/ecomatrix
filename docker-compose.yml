services:
  db:
    image: postgres:16-alpine
    container_name: ecomatrix-postgres
    environment:
      POSTGRES_USER: repotwin
      POSTGRES_PASSWORD: repotwin
      POSTGRES_DB: ecomatrix
    ports:
      - "5432:5432"
    volumes:
      - ecomatrix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repotwin -d ecomatrix"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecomatrix_pg:
