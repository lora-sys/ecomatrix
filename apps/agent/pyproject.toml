[project]
name = "ecomatrix-agent"
version = "0.2.0"
description = "EcoMatrix Python agent runner (LangGraph + A2A v1.1 client)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
ecomatrix-agent = "ecomatrix.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecomatrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
